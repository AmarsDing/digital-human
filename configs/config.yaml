server:
  http_addr: "127.0.0.1:8795"
  read_timeout: 15s
  write_timeout: 30s
  shutdown_timeout: 5s
  metrics_loopback: true

data:
  # 本机未部署 PG/Redis 时留空，进程以 degraded 模式启动（默认 /healthz 仍返回 200，
  # 以 status=degraded + missing 显式标注；health.require_dependencies=true 时恢复返回 503）。
  postgres_dsn: ""
  # 单实例默认最多 20 个连接，避免压满本机 PG；保留 5 个热连接降低常规请求建连开销。
  postgres_max_open_conns: 20
  postgres_max_idle_conns: 5
  # 30 分钟轮换长连接以适配故障转移/代理重平衡，空闲 5 分钟即释放资源。
  postgres_conn_max_lifetime: 30m
  postgres_conn_max_idle_time: 5m
  redis_addr: ""
  connect_timeout: 5s
  required: false
  event_retention_days: 90

health:
  # 默认 false：进程可服务即探活 200，缺 PG/Redis 以 status=degraded + missing 标注（降级是支持模式）。
  # true 恢复旧行为：依赖未齐 /healthz 返回 503。
  require_dependencies: false

# 所有文字上屏、合成、缓存播放与动作下发前的统一终检；显式 enabled=false 才关闭。
content_gate:
  enabled: true
  rules_path: "configs/content_gate.yaml"
  allow_review: false
  circuit_breaker_threshold: 3

security:
  # local: 仅允许 loopback 访问（默认）。lan: 必须配置 admin_token_sha256。
  # collector: 弹幕采集器走 HMAC，其余走 Bearer。
  mode: "local"
  admin_token_sha256: ""
  allowed_origins: []
  ticket_ttl: 60s

log:
  level: "info"
  format: "json"

# RTC 凭据签发：默认 disabled（/api/v1/live/rtc-token 返回 unconfigured，前端显示"未配置"）。
# dev 联调：DH_RTC_MODE=dev + DH_RTC_API_KEY/DH_RTC_API_SECRET 环境变量（密钥不入 yaml）。
# managed：需装配真实厂商签发器，未装配时仍 fail-closed。
rtc:
  mode: "disabled"
  provider: "artc"
  room_prefix: "dh-"
  token_ttl: 10m

# 运营语音阶段一：默认本地 CPU sherpa；模型路径为空或许可未确认时 ASR 明确 unconfigured。
# fake 仅在 engine.mode=dev 且 provider=fake 时装配；cloud 当前无实现，始终 fail-closed。
voice:
  asr:
    provider: "sherpa"
    fake_text: "dev 模拟识别"
    allow_local_sidecar: true
    allow_cloud: false
    model_license_acknowledged: false
    python_bin: "python"
    script_path: "internal/biz/voice/sherpa_sidecar.py"
    model_type: "zipformer"
    tokens: ""
    encoder: ""
    decoder: ""
    joiner: ""
    threads: 2
    startup_timeout: 15s
  asr_timeout: 5s
  llm_timeout: 45s
  turn_timeout: 90s
  max_audio: 20s
  partial_interval: 200ms
  barge_in: 250ms
  allow_continuous: true
  interrupt_songs: false
  persist_text: true
  retain_audio: false
  allow_cross_owner_preempt: false
  coordinate_text_chat: true
  vad:
    silence: 600ms
    min_speech: 300ms
    min_start_speech: 120ms
    absolute_dbfs: -45
